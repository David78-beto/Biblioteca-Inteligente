{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<h1>Entrar</h1>
<form class="formulario" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="acciones">
        <button class="boton" type="submit">Entrar</button>
        <a href="{% url 'registro' %}">¿No tienes cuenta? Regístrate</a>
    </div>
</form>
{% endblock %}
