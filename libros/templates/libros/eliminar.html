{% extends "base.html" %}
{% block titulo %}Eliminar libro{% endblock %}
{% block contenido %}
<h1>¿Eliminar «{{ libro.titulo }}»?</h1>
<p>Esta acción no se puede deshacer.</p>
<form method="post" class="acciones">
    {% csrf_token %}
    <button class="boton peligro" type="submit">Sí, eliminar</button>
    <a class="boton secundario" href="{% url 'detail' libro.id %}">Cancelar</a>
</form>
{% endblock %}
