{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<form class="formulario" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="acciones">
        <button class="boton" type="submit">Guardar</button>
        <a class="boton secundario" href="{% if libro %}{% url 'detail' libro.id %}{% else %}{% url 'index' %}{% endif %}">Cancelar</a>
    </div>
</form>
{% endblock %}
