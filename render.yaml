databases:
  - name: biblioteca-db
    plan: free
    databaseName: biblioteca
    user: biblioteca

services:
  - type: web
    name: biblioteca-inteligente
    runtime: docker
    plan: free
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
